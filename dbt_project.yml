name: 'f1_case'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Marts start here. Earlier seasons have shared cars and teams with more than two cars,
  # which breaks the teammate pair logic.
  start_season: 2011

models:
  f1_case:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table