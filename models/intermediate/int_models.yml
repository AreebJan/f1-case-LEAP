version: 2

models:
  - name: int_results_classified
    description: "Race results with a simple category for how each race ended, plus a true/false column for whether the driver made it to the finish."
    columns:
      - name: status_category
        description: "How the race ended, in six groups: finished, lapped, mechanical, driver_incident, other or unknown. The mapping is kept in the status_categories seed."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['finished', 'lapped', 'mechanical', 'driver_incident', 'other', 'unknown']

  - name: int_teammate_pairs
    description: "Each driver's race result next to their teammate's result from the same race. Made by matching results on race and team."
    columns:
      - name: race_id
        data_tests:
          - not_null
      - name: driver_1_id
        data_tests:
          - not_null
      - name: driver_2_id
        data_tests:
          - not_null

  - name: int_qualifying_pairs
    description: "Same idea for qualifying: each driver's qualifying position and lap times next to their teammate's."
    columns:
      - name: race_id
        data_tests:
          - not_null
      - name: driver_1_id
        data_tests:
          - not_null
      - name: driver_2_id
        data_tests:
          - not_null